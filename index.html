<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#23272e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="fx-100MS" />
  <title>CASIO fx-100MS (S-V.P.A.M.)</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    .calc-casing {
      background: linear-gradient(145deg, #343a44 0%, #242830 50%, #191c22 100%);
      box-shadow: 
        0 28px 60px rgba(0, 0, 0, 0.9),
        inset 0 2px 3px rgba(255, 255, 255, 0.18),
        inset 0 -5px 8px rgba(0, 0, 0, 0.7);
      border: 2.5px solid #14171c;
    }
    .lcd-bezel {
      background: linear-gradient(180deg, #171a20 0%, #262b34 100%);
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.1);
    }
    .lcd-screen {
      background-color: #9ead86;
      background-image: 
        linear-gradient(rgba(18, 26, 14, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 26, 14, 0.03) 1px, transparent 1px);
      background-size: 3px 3px;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5), inset 0 0 14px rgba(50, 65, 35, 0.3);
      border: 2px solid #576346;
    }
    .font-matrix {
      font-family: 'VT323', monospace;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
    }
    .font-segment {
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.05em;
      text-shadow: 0 1.5px 0 rgba(0, 0, 0, 0.14);
    }
    .solar-panel {
      background: repeating-linear-gradient(
        90deg,
        #382112,
        #382112 15px,
        #52321e 15px,
        #52321e 16.5px
      );
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.85), 0 1px 0 rgba(255,255,255,0.12);
      border: 1.5px solid #181210;
    }
    .btn-small {
      background: linear-gradient(180deg, #454d59 0%, #2c323b 100%);
      box-shadow: 0 3px 0 #15181e, 0 4px 5px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.22);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-small:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #15181e, 0 2px 2px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.15);
    }
    .btn-num {
      background: linear-gradient(180deg, #5c6573 0%, #404752 100%);
      box-shadow: 0 4px 0 #1c2026, 0 5px 6px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.28);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1c2026, 0 2px 3px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.2);
    }
    .btn-ac {
      background: linear-gradient(180deg, #cc4b62 0%, #9b2d41 100%);
      box-shadow: 0 4px 0 #551420, 0 5px 6px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.32);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-ac:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #551420, 0 2px 3px rgba(0,0,0,0.45);
    }
    .replay-pad {
      background: linear-gradient(145deg, #414956, #272c35);
      box-shadow: 0 4px 8px rgba(0,0,0,0.65), inset 0 1px 2px rgba(255,255,255,0.22);
      border: 2px solid #1b1f26;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Install App Floating Bar -->
  <div id="installBanner" class="hidden fixed top-3 z-50 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-full shadow-xl flex items-center gap-2 cursor-pointer transition transform active:scale-95 border border-emerald-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
    </svg>
    <span class="text-xs sm:text-sm font-bold tracking-wide">Install fx-100MS App</span>
  </div>

  <!-- Calculator Body -->
  <div class="calc-casing w-full max-w-[385px] rounded-[34px] p-4 sm:p-5 flex flex-col gap-3 relative">
    
    <!-- Top Branding & Solar Panel -->
    <div class="flex justify-between items-start px-1 pt-1">
      <div class="flex flex-col">
        <span class="text-white font-extrabold text-lg tracking-wider leading-none">CASIO</span>
        <span class="text-gray-300 font-bold italic text-xs tracking-wide mt-0.5">fx-100MS</span>
        <span class="text-[#e07b58] font-extrabold text-[10px] tracking-widest mt-1">S-V.P.A.M.</span>
      </div>
      <div class="flex flex-col items-end">
        <div class="solar-panel w-28 h-8 rounded-md"></div>
        <span class="text-[8px] text-gray-400 font-bold tracking-widest mt-1">TWO WAY POWER</span>
      </div>
    </div>

    <!-- LCD Display Screen -->
    <div class="lcd-bezel p-2.5 rounded-xl">
      <div class="lcd-screen h-[102px] rounded-lg px-2.5 py-1.5 flex flex-col justify-between text-[#11190d] relative overflow-hidden">
        
        <!-- Status Indicators Row -->
        <div class="flex justify-between items-center text-[9.5px] font-extrabold tracking-tight border-b border-[#85946e] pb-0.5 leading-none">
          <div class="flex gap-1.5 items-center">
            <span id="ind-shift" class="opacity-15 bg-[#11190d] text-[#9ead86] px-1 py-[1px] rounded-[2px]">S</span>
            <span id="ind-alpha" class="opacity-15 bg-[#11190d] text-[#9ead86] px-1 py-[1px] rounded-[2px]">A</span>
            <span id="ind-m" class="opacity-15">M</span>
            <span id="ind-sto" class="opacity-15">STO</span>
            <span id="ind-rcl" class="opacity-15">RCL</span>
            <span id="ind-hyp" class="opacity-15">HYP</span>
          </div>
          <div class="flex gap-1.5 items-center">
            <span id="ind-mode" class="opacity-100">COMP</span>
            <span id="ind-angle" class="opacity-100 bg-[#11190d] text-[#9ead86] px-1 py-[1px] rounded-[2px]">D</span>
            <span id="ind-fix" class="opacity-15">FIX</span>
            <span id="ind-sci" class="opacity-15">SCI</span>
          </div>
        </div>

        <!-- Upper Dot-Matrix Expression Line -->
        <div id="exprDisplay" class="font-matrix text-[24px] leading-none h-7 overflow-x-auto whitespace-nowrap flex items-center pt-0.5">
          <span id="exprLeft"></span><span id="cursor" class="cursor-blink font-bold">_</span><span id="exprRight"></span>
        </div>

        <!-- Lower 7-Segment Result Line -->
        <div class="flex justify-end items-baseline h-8 pr-0.5">
          <div id="resDisplay" class="font-segment text-[23px] sm:text-[25px] font-extrabold tracking-wider text-right truncate">0.</div>
          <div id="expDisplay" class="font-segment text-[12px] font-extrabold ml-1"></div>
        </div>

      </div>
    </div>

    <!-- Top Control Row + Replay D-Pad -->
    <div class="grid grid-cols-5 items-center gap-1.5 my-0.5">
      <div class="flex flex-col items-center">
        <span class="text-[9px] font-bold text-[#e69f45] mb-0.5">SHIFT</span>
        <button onclick="pressShift()" class="btn-small w-full h-7 rounded-full"></button>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-[9px] font-bold text-[#d45d79] mb-0.5">ALPHA</span>
        <button onclick="pressAlpha()" class="btn-small w-full h-7 rounded-full"></button>
      </div>

      <!-- Center Replay Pad -->
      <div class="flex justify-center">
        <div class="replay-pad w-16 h-14 rounded-full relative flex items-center justify-center">
          <span class="text-[7px] text-gray-300 font-bold tracking-widest pointer-events-none">REPLAY</span>
          <button onclick="moveCursor('UP')" class="absolute top-0.5 inset-x-3 h-4 flex justify-center items-start text-[9px] text-gray-200 hover:text-white active:scale-90">▲</button>
          <button onclick="moveCursor('DOWN')" class="absolute bottom-0.5 inset-x-3 h-4 flex justify-center items-end text-[9px] text-gray-200 hover:text-white active:scale-90">▼</button>
          <button onclick="moveCursor('LEFT')" class="absolute left-0.5 inset-y-3 w-4 flex items-center justify-start text-[9px] text-gray-200 hover:text-white active:scale-90">◀</button>
          <button onclick="moveCursor('RIGHT')" class="absolute right-0.5 inset-y-3 w-4 flex items-center justify-end text-[9px] text-gray-200 hover:text-white active:scale-90">▶</button>
        </div>
      </div>

      <div class="flex flex-col items-center">
        <span class="text-[9px] font-bold text-gray-300 mb-0.5">MODE <span class="text-[#e69f45]">CLR</span></span>
        <button onclick="pressMode()" class="btn-small w-full h-7 rounded-full"></button>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-[9px] font-bold text-gray-300 mb-0.5">ON</span>
        <button onclick="pressOn()" class="btn-small w-full h-7 rounded-full"></button>
      </div>
    </div>

    <!-- Scientific Function Grid (6 Columns x 4 Rows) -->
    <div class="grid grid-cols-6 gap-x-1.5 gap-y-2 text-center">
      
      <!-- Row 1 -->
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">SOLVE</span><span class="text-[#d45d79]">=</span></div>
        <button onclick="handleSci('CALC')" class="btn-small h-7 rounded text-[10px] font-bold text-white">CALC</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">d/dx</div>
        <button onclick="handleSci('INT')" class="btn-small h-7 rounded text-[10px] font-bold text-white">∫dx</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight">&nbsp;</div>
        <button onclick="moveCursor('LEFT')" class="btn-small h-7 rounded text-[10px] font-bold text-gray-200">◀</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight">&nbsp;</div>
        <button onclick="moveCursor('RIGHT')" class="btn-small h-7 rounded text-[10px] font-bold text-gray-200">▶</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">x!</div>
        <button onclick="handleSci('INV')" class="btn-small h-7 rounded text-[10px] font-bold text-white">x⁻¹</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">³√</div>
        <button onclick="handleSci('CBRT_POW')" class="btn-small h-7 rounded text-[10px] font-bold text-white">x³</button>
      </div>

      <!-- Row 2 -->
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">d/c</div>
        <button onclick="handleSci('FRAC')" class="btn-small h-7 rounded text-[10px] font-bold text-white">a b/c</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight">&nbsp;</div>
        <button onclick="handleSci('SQRT')" class="btn-small h-7 rounded text-[11px] font-bold text-white">√</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight">&nbsp;</div>
        <button onclick="handleSci('SQ')" class="btn-small h-7 rounded text-[10px] font-bold text-white">x²</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">ˣ√</div>
        <button onclick="handleSci('POW')" class="btn-small h-7 rounded text-[11px] font-bold text-white">^</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">10ˣ</div>
        <button onclick="handleSci('LOG')" class="btn-small h-7 rounded text-[10px] font-bold text-white">log</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">eˣ</span><span class="text-[#d45d79]">e</span></div>
        <button onclick="handleSci('LN')" class="btn-small h-7 rounded text-[10px] font-bold text-white">ln</button>
      </div>

      <!-- Row 3 -->
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#d45d79]">A</div>
        <button onclick="handleSci('NEG')" class="btn-small h-7 rounded text-[10px] font-bold text-white">(-)</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">←</span><span class="text-[#d45d79]">B</span></div>
        <button onclick="handleSci('DMS')" class="btn-small h-7 rounded text-[10px] font-bold text-white">° ' "</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#d45d79]">C</div>
        <button onclick="handleSci('HYP')" class="btn-small h-7 rounded text-[10px] font-bold text-white">hyp</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">sin⁻¹</span><span class="text-[#d45d79]">D</span></div>
        <button onclick="handleSci('SIN')" class="btn-small h-7 rounded text-[10px] font-bold text-white">sin</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">cos⁻¹</span><span class="text-[#d45d79]">E</span></div>
        <button onclick="handleSci('COS')" class="btn-small h-7 rounded text-[10px] font-bold text-white">cos</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">tan⁻¹</span><span class="text-[#d45d79]">F</span></div>
        <button onclick="handleSci('TAN')" class="btn-small h-7 rounded text-[10px] font-bold text-white">tan</button>
      </div>

      <!-- Row 4 -->
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">STO</div>
        <button onclick="handleSci('RCL')" class="btn-small h-7 rounded text-[10px] font-bold text-white">RCL</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#e69f45]">←</div>
        <button onclick="handleSci('ENG')" class="btn-small h-7 rounded text-[10px] font-bold text-white">ENG</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight">&nbsp;</div>
        <button onclick="insertToken('(')" class="btn-small h-7 rounded text-[10px] font-bold text-white">(</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight text-[#d45d79]">X</div>
        <button onclick="handleSci('RPAREN')" class="btn-small h-7 rounded text-[10px] font-bold text-white">)</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">;</span><span class="text-[#d45d79]">Y</span></div>
        <button onclick="handleSci('COMMA')" class="btn-small h-7 rounded text-[10px] font-bold text-white">,</button>
      </div>
      <div class="flex flex-col">
        <div class="text-[8px] leading-tight flex justify-between px-0.5"><span class="text-[#e69f45]">M-</span><span class="text-[#d45d79]">M</span></div>
        <button onclick="handleSci('MPLUS')" class="btn-small h-7 rounded text-[10px] font-bold text-white">M+</button>
      </div>

    </div>

    <!-- Main Number Pad (5 Columns x 4 Rows) -->
    <div class="grid grid-cols-5 gap-2 text-center mt-1">
      
      <!-- Row 1 -->
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">CONST</span>
        <button onclick="handleNum('7')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">7</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">CONV</span>
        <button onclick="handleNum('8')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">8</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('9')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">9</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">INS</span>
        <button onclick="pressDel()" class="btn-ac h-9 rounded-md text-xs font-extrabold text-white">DEL</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">OFF</span>
        <button onclick="pressAc()" class="btn-ac h-9 rounded-md text-xs font-extrabold text-white">AC</button>
      </div>

      <!-- Row 2 -->
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('4')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">4</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('5')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">5</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('6')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">6</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">nPr</span>
        <button onclick="handleOp('×')" class="btn-num h-9 rounded-md text-base font-extrabold text-white">×</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">nCr</span>
        <button onclick="handleOp('÷')" class="btn-num h-9 rounded-md text-base font-extrabold text-white">÷</button>
      </div>

      <!-- Row 3 -->
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('1')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">1</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('2')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">2</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">&nbsp;</span>
        <button onclick="handleNum('3')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">3</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">Pol(</span>
        <button onclick="handleOp('+')" class="btn-num h-9 rounded-md text-base font-extrabold text-white">+</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">Rec(</span>
        <button onclick="handleOp('-')" class="btn-num h-9 rounded-md text-base font-extrabold text-white">−</button>
      </div>

      <!-- Row 4 -->
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">Rnd</span>
        <button onclick="handleNum('0')" class="btn-num h-9 rounded-md text-sm font-extrabold text-white">0</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">Ran#</span>
        <button onclick="handleDot()" class="btn-num h-9 rounded-md text-base font-extrabold text-white">.</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">π</span>
        <button onclick="handleExp()" class="btn-num h-9 rounded-md text-xs font-extrabold text-white">EXP</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">DRG►</span>
        <button onclick="handleAns()" class="btn-num h-9 rounded-md text-xs font-extrabold text-white">Ans</button>
      </div>
      <div class="flex flex-col">
        <span class="text-[8px] text-[#e69f45] h-3">%</span>
        <button onclick="evaluateExpression()" class="btn-num h-9 rounded-md text-base font-extrabold text-white">=</button>
      </div>

    </div>

  </div>

  <script>
    // --- Calculator State ---
    let tokens = [];
    let cursorPos = 0;
    let ans = 0;
    let lastResult = 0;
    let isResultDisplayed = false;
    let isPoweredOff = false;

    let shiftActive = false;
    let alphaActive = false;
    let hypActive = false;
    let stoActive = false;
    let rclActive = false;

    let angleMode = 'DEG'; // DEG, RAD, GRAD
    let modeMenuStep = 0;
    let fixDigits = null;
    let sciDigits = null;
    let engShift = 0;
    let dmsMode = false;
    let fracMode = false;

    let history = [];
    let historyIndex = -1;

    const memory = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0 };

    const SCIENTIFIC_CONSTANTS = {
      '01': 1.67262158e-27,
      '02': 1.67492716e-27,
      '03': 9.10938188e-31,
      '06': 6.62606876e-34,
      '17': 1.60217646e-19,
      '24': 6.02214199e23,
      '27': 8.314472,
      '28': 299792458,
      '35': 9.80665
    };

    // --- UI Update ---
    function updateDisplay() {
      const exprLeftEl = document.getElementById('exprLeft');
      const exprRightEl = document.getElementById('exprRight');
      const cursorEl = document.getElementById('cursor');
      const resEl = document.getElementById('resDisplay');
      const expEl = document.getElementById('expDisplay');

      if (isPoweredOff) {
        exprLeftEl.textContent = '';
        exprRightEl.textContent = '';
        cursorEl.style.display = 'none';
        resEl.textContent = '';
        expEl.textContent = '';
        return;
      }
      cursorEl.style.display = 'inline';

      document.getElementById('ind-shift').style.opacity = shiftActive ? '1' : '0.15';
      document.getElementById('ind-alpha').style.opacity = alphaActive ? '1' : '0.15';
      document.getElementById('ind-m').style.opacity = memory.M !== 0 ? '1' : '0.15';
      document.getElementById('ind-sto').style.opacity = stoActive ? '1' : '0.15';
      document.getElementById('ind-rcl').style.opacity = rclActive ? '1' : '0.15';
      document.getElementById('ind-hyp').style.opacity = hypActive ? '1' : '0.15';
      document.getElementById('ind-angle').textContent = angleMode === 'DEG' ? 'D' : angleMode === 'RAD' ? 'R' : 'G';
      document.getElementById('ind-fix').style.opacity = fixDigits !== null ? '1' : '0.15';
      document.getElementById('ind-sci').style.opacity = sciDigits !== null ? '1' : '0.15';

      if (modeMenuStep === 1) {
        exprLeftEl.textContent = 'COMP   CMPLX';
        exprRightEl.textContent = '';
        resEl.textContent = '1      2';
        expEl.textContent = '';
        return;
      } else if (modeMenuStep === 2) {
        exprLeftEl.textContent = 'Deg   Rad   Gra';
        exprRightEl.textContent = '';
        resEl.textContent = '1     2     3';
        expEl.textContent = '';
        return;
      }

      exprLeftEl.textContent = tokens.slice(0, cursorPos).join('');
      exprRightEl.textContent = tokens.slice(cursorPos).join('');

      if (!isResultDisplayed) {
        if (tokens.length === 0) {
          resEl.textContent = '0.';
          expEl.textContent = '';
        }
        return;
      }

      if (typeof lastResult === 'string') {
        resEl.textContent = lastResult;
        expEl.textContent = '';
        return;
      }

      if (dmsMode) {
        resEl.textContent = formatDMS(lastResult);
        expEl.textContent = '';
        return;
      }

      if (fracMode) {
        resEl.textContent = formatFraction(lastResult);
        expEl.textContent = '';
        return;
      }

      formatNumericResult(lastResult, resEl, expEl);
    }

    function formatNumericResult(val, resEl, expEl) {
      if (!isFinite(val)) {
        resEl.textContent = 'Math ERROR';
        expEl.textContent = '';
        return;
      }
      if (Math.abs(val) < 1e-14) val = 0;

      if (engShift !== 0 && val !== 0) {
        const exp = Math.floor(Math.log10(Math.abs(val)) / 3) * 3 + (engShift - 1) * 3;
        const mantissa = val / Math.pow(10, exp);
        resEl.textContent = Number(mantissa.toPrecision(10)).toString();
        expEl.textContent = `×10^${exp}`;
        return;
      }

      if (fixDigits !== null) {
        resEl.textContent = val.toFixed(fixDigits);
        expEl.textContent = '';
        return;
      }

      if (sciDigits !== null) {
        const parts = val.toExponential(sciDigits - 1).split('e');
        resEl.textContent = parts[0];
        expEl.textContent = `×10^${parseInt(parts[1], 10)}`;
        return;
      }

      if (val !== 0 && (Math.abs(val) >= 1e10 || Math.abs(val) < 1e-3)) {
        const parts = val.toExponential(9).split('e');
        resEl.textContent = parseFloat(parts[0]).toString();
        expEl.textContent = `×10^${parseInt(parts[1], 10)}`;
      } else {
        let str = Number(val.toPrecision(10)).toString();
        if (!str.includes('.')) str += '.';
        resEl.textContent = str;
        expEl.textContent = '';
      }
    }

    function formatDMS(deg) {
      const sign = deg < 0 ? '-' : '';
      let abs = Math.abs(deg);
      const d = Math.floor(abs);
      const mFloat = (abs - d) * 60;
      const m = Math.floor(mFloat);
      const s = ((mFloat - m) * 60).toFixed(1);
      return `${sign}${d}°${m}'${s}"`;
    }

    function formatFraction(val) {
      const sign = val < 0 ? '-' : '';
      const abs = Math.abs(val);
      const tol = 1.0e-7;
      let h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = abs;
      do {
        let a = Math.floor(b);
        let aux = h1; h1 = a * h1 + h2; h2 = aux;
        aux = k1; k1 = a * k1 + k2; k2 = aux;
        b = 1 / (b - a);
      } while (Math.abs(abs - h1 / k1) > abs * tol && k1 < 10000);

      if (k1 === 1) return `${sign}${h1}.`;
      if (shiftActive) {
        shiftActive = false;
        return `${sign}${h1}⌟${k1}`;
      }
      if (h1 > k1) {
        const whole = Math.floor(h1 / k1);
        const rem = h1 % k1;
        return `${sign}${whole}⌟${rem}⌟${k1}`;
      }
      return `${sign}${h1}⌟${k1}`;
    }

    // --- Core Input Controls ---
    function clearModifiers() {
      shiftActive = false;
      alphaActive = false;
      hypActive = false;
    }

    function pressShift() {
      if (isPoweredOff) return;
      shiftActive = !shiftActive;
      alphaActive = false;
      updateDisplay();
    }

    function pressAlpha() {
      if (isPoweredOff) return;
      alphaActive = !alphaActive;
      shiftActive = false;
      updateDisplay();
    }

    function pressMode() {
      if (isPoweredOff) return;
      if (shiftActive) {
        tokens = [];
        cursorPos = 0;
        ans = 0;
        Object.keys(memory).forEach(k => memory[k] = 0);
        clearModifiers();
        lastResult = 'Mem Cleared';
        isResultDisplayed = true;
        updateDisplay();
        return;
      }
      modeMenuStep = (modeMenuStep + 1) % 3;
      updateDisplay();
    }

    function pressOn() {
      isPoweredOff = false;
      tokens = [];
      cursorPos = 0;
      lastResult = 0;
      isResultDisplayed = false;
      modeMenuStep = 0;
      clearModifiers();
      stoActive = false;
      rclActive = false;
      updateDisplay();
    }

    function pressAc() {
      if (shiftActive) {
        isPoweredOff = true;
        clearModifiers();
        updateDisplay();
        return;
      }
      isPoweredOff = false;
      tokens = [];
      cursorPos = 0;
      isResultDisplayed = false;
      modeMenuStep = 0;
      dmsMode = false;
      fracMode = false;
      engShift = 0;
      clearModifiers();
      stoActive = false;
      rclActive = false;
      updateDisplay();
    }

    function pressDel() {
      if (isPoweredOff) return;
      if (isResultDisplayed) {
        isResultDisplayed = false;
      }
      if (cursorPos > 0) {
        tokens.splice(cursorPos - 1, 1);
        cursorPos--;
      }
      clearModifiers();
      updateDisplay();
    }

    function moveCursor(dir) {
      if (isPoweredOff) return;
      if (dir === 'LEFT') {
        if (isResultDisplayed) {
          isResultDisplayed = false;
          cursorPos = tokens.length;
        } else if (cursorPos > 0) {
          cursorPos--;
        }
      } else if (dir === 'RIGHT') {
        if (isResultDisplayed) {
          isResultDisplayed = false;
          cursorPos = 0;
        } else if (cursorPos < tokens.length) {
          cursorPos++;
        }
      } else if (dir === 'UP' && history.length > 0) {
        if (historyIndex > 0) historyIndex--;
        tokens = [...history[historyIndex].tokens];
        cursorPos = tokens.length;
        lastResult = history[historyIndex].result;
        isResultDisplayed = true;
      } else if (dir === 'DOWN' && history.length > 0) {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          tokens = [...history[historyIndex].tokens];
          cursorPos = tokens.length;
          lastResult = history[historyIndex].result;
          isResultDisplayed = true;
        }
      }
      updateDisplay();
    }

    function insertToken(tok, startWithAns = false) {
      if (isPoweredOff) return;
      if (isResultDisplayed) {
        tokens = startWithAns ? ['Ans'] : [];
        cursorPos = tokens.length;
        isResultDisplayed = false;
        dmsMode = false;
        fracMode = false;
        engShift = 0;
      }
      tokens.splice(cursorPos, 0, tok);
      cursorPos++;
      clearModifiers();
      updateDisplay();
    }

    function handleVariableAction(varName) {
      if (stoActive) {
        if (!isResultDisplayed) evaluateExpression();
        if (typeof lastResult === 'number') {
          memory[varName] = lastResult;
          tokens = [`Ans→${varName}`];
          cursorPos = tokens.length;
        }
        stoActive = false;
        clearModifiers();
        updateDisplay();
        return true;
      }
      if (rclActive) {
        tokens = [`${varName}=`];
        cursorPos = tokens.length;
        lastResult = memory[varName];
        isResultDisplayed = true;
        rclActive = false;
        clearModifiers();
        updateDisplay();
        return true;
      }
      if (alphaActive) {
        insertToken(varName);
        return true;
      }
      return false;
    }

    function handleNum(d) {
      if (isPoweredOff) return;

      if (modeMenuStep === 1) {
        modeMenuStep = 0;
        updateDisplay();
        return;
      }
      if (modeMenuStep === 2) {
        if (d === '1') angleMode = 'DEG';
        if (d === '2') angleMode = 'RAD';
        if (d === '3') angleMode = 'GRAD';
        modeMenuStep = 0;
        updateDisplay();
        return;
      }

      if (shiftActive) {
        if (d === '7') {
          const code = prompt('Enter Constant Number (01: mp, 02: mn, 03: me, 06: h, 17: e, 24: NA, 27: R, 28: c, 35: g):', '28');
          if (code && SCIENTIFIC_CONSTANTS[code]) {
            insertToken(SCIENTIFIC_CONSTANTS[code].toString());
          }
          clearModifiers();
          updateDisplay();
          return;
        }
        if (d === '0') {
          lastResult = Math.round(lastResult * 1e10) / 1e10;
          clearModifiers();
          updateDisplay();
          return;
        }
      }

      insertToken(d);
    }

    function handleDot() {
      if (shiftActive) {
        insertToken(Number(Math.random().toFixed(3)).toString());
        return;
      }
      insertToken('.');
    }

    function handleExp() {
      if (shiftActive) {
        insertToken('π');
        return;
      }
      insertToken('E');
    }

    function handleAns() {
      if (shiftActive) {
        angleMode = angleMode === 'DEG' ? 'RAD' : angleMode === 'RAD' ? 'GRAD' : 'DEG';
        clearModifiers();
        updateDisplay();
        return;
      }
      insertToken('Ans');
    }

    function handleOp(op) {
      if (shiftActive) {
        if (op === '×') { insertToken('P', true); return; }
        if (op === '÷') { insertToken('C', true); return; }
        if (op === '+') { insertToken('Pol('); return; }
        if (op === '-') { insertToken('Rec('); return; }
      }
      insertToken(op, true);
    }

    function handleSci(type) {
      if (isPoweredOff) return;

      const varMap = { NEG: 'A', DMS: 'B', HYP: 'C', SIN: 'D', COS: 'E', TAN: 'F', RPAREN: 'X', COMMA: 'Y', MPLUS: 'M' };
      if (varMap[type] && (stoActive || rclActive || alphaActive)) {
        if (handleVariableAction(varMap[type])) return;
      }

      switch (type) {
        case 'CALC':
          if (alphaActive) { insertToken('='); return; }
          const xVal = prompt('X = ?', memory.X);
          if (xVal !== null && !isNaN(parseFloat(xVal))) {
            memory.X = parseFloat(xVal);
            evaluateExpression();
          }
          break;
        case 'INT':
          if (shiftActive) insertToken('d/dx(');
          else insertToken('∫(');
          break;
        case 'INV':
          if (shiftActive) insertToken('!', true);
          else insertToken('⁻¹', true);
          break;
        case 'CBRT_POW':
          if (shiftActive) insertToken('³√');
          else insertToken('³', true);
          break;
        case 'FRAC':
          if (isResultDisplayed) {
            fracMode = !fracMode;
            dmsMode = false;
            updateDisplay();
          } else {
            insertToken('⌟');
          }
          break;
        case 'SQRT':
          insertToken('√');
          break;
        case 'SQ':
          insertToken('²', true);
          break;
        case 'POW':
          if (shiftActive) insertToken('ˣ√', true);
          else insertToken('^', true);
          break;
        case 'LOG':
          if (shiftActive) insertToken('10^');
          else insertToken('log ');
          break;
        case 'LN':
          if (shiftActive) insertToken('e^');
          else if (alphaActive) insertToken('e');
          else insertToken('ln ');
          break;
        case 'NEG':
          insertToken('-');
          break;
        case 'DMS':
          if (isResultDisplayed) {
            dmsMode = !dmsMode;
            fracMode = false;
            clearModifiers();
            updateDisplay();
          } else {
            insertToken('°');
          }
          break;
        case 'HYP':
          hypActive = !hypActive;
          updateDisplay();
          break;
        case 'SIN':
        case 'COS':
        case 'TAN': {
          const base = type.toLowerCase();
          if (hypActive && shiftActive) insertToken(`${base}h⁻¹ `);
          else if (hypActive) insertToken(`${base}h `);
          else if (shiftActive) insertToken(`${base}⁻¹ `);
          else insertToken(`${base} `);
          break;
        }
        case 'RCL':
          if (shiftActive) {
            stoActive = !stoActive;
            rclActive = false;
            shiftActive = false;
          } else {
            rclActive = !rclActive;
            stoActive = false;
          }
          updateDisplay();
          break;
        case 'ENG':
          if (!isResultDisplayed) evaluateExpression();
          if (shiftActive) engShift--;
          else engShift++;
          clearModifiers();
          updateDisplay();
          break;
        case 'RPAREN':
          insertToken(')');
          break;
        case 'COMMA':
          insertToken(',');
          break;
        case 'MPLUS':
          const sign = shiftActive ? -1 : 1;
          evaluateExpression();
          if (typeof lastResult === 'number') {
            memory.M += sign * lastResult;
          }
          clearModifiers();
          updateDisplay();
          break;
      }
    }

    // --- Bulletproof Casio S-V.P.A.M. Recursive-Descent Evaluator ---
    function toRad(x) {
      if (angleMode === 'DEG') return x * Math.PI / 180;
      if (angleMode === 'GRAD') return x * Math.PI / 200;
      return x;
    }
    function fromRad(x) {
      if (angleMode === 'DEG') return x * 180 / Math.PI;
      if (angleMode === 'GRAD') return x * 200 / Math.PI;
      return x;
    }
    function fact(n) {
      if (n < 0 || Math.floor(n) !== n) return NaN;
      if (n > 170) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }
    function nPr(n, r) { return fact(n) / fact(n - r); }
    function nCr(n, r) { return fact(n) / (fact(r) * fact(n - r)); }

    function tokenizeMath(str) {
      const list = [];
      let i = 0;
      const multiTokens = [
        'sinh⁻¹', 'cosh⁻¹', 'tanh⁻¹',
        'sin⁻¹', 'cos⁻¹', 'tan⁻¹',
        'sinh', 'cosh', 'tanh',
        'sin', 'cos', 'tan',
        'log', 'ln', '10^', 'e^',
        'Pol(', 'Rec(', '³√', 'ˣ√', '⁻¹', 'Ans'
      ];

      while (i < str.length) {
        if (/\s/.test(str[i])) { i++; continue; }

        // Number literal (supports scientific E notation like 1.5E-3)
        const numMatch = str.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:E[+-]?\d+)?/);
        if (numMatch) {
          list.push({ type: 'NUM', val: parseFloat(numMatch[0]) });
          i += numMatch[0].length;
          continue;
        }

        // Check multi-character function/operator tokens
        let matched = false;
        for (const mt of multiTokens) {
          if (str.startsWith(mt, i)) {
            if (mt === 'Pol(' || mt === 'Rec(') {
              list.push({ type: 'FUNC2', val: mt.slice(0, 3) });
              list.push({ type: 'LPAREN', val: '(' });
            } else if (mt === 'ˣ√') {
              list.push({ type: 'OP', val: 'ˣ√' });
            } else if (mt === '⁻¹') {
              list.push({ type: 'POST', val: '⁻¹' });
            } else if (mt === 'Ans') {
              list.push({ type: 'NUM', val: ans });
            } else {
              list.push({ type: 'PRE', val: mt });
            }
            i += mt.length;
            matched = true;
            break;
          }
        }
        if (matched) continue;

        const ch = str[i];
        if (ch === '√') { list.push({ type: 'PRE', val: '√' }); i++; continue; }
        if (ch === 'π') { list.push({ type: 'NUM', val: Math.PI }); i++; continue; }
        if (ch === 'e') { list.push({ type: 'NUM', val: Math.E }); i++; continue; }
        if ('ABCDEFXYM'.includes(ch)) { list.push({ type: 'NUM', val: memory[ch] || 0 }); i++; continue; }
        if ('²³!°'.includes(ch)) { list.push({ type: 'POST', val: ch }); i++; continue; }
        if ('+-×÷^PC⌟'.includes(ch)) { list.push({ type: 'OP', val: ch }); i++; continue; }
        if (ch === '(') { list.push({ type: 'LPAREN', val: '(' }); i++; continue; }
        if (ch === ')') { list.push({ type: 'RPAREN', val: ')' }); i++; continue; }
        if (ch === ',') { list.push({ type: 'COMMA', val: ',' }); i++; continue; }

        throw new Error('Unknown token: ' + ch);
      }

      // Insert implicit multiplication where Casio S-V.P.A.M. expects it:
      // e.g. 2 sin 30 -> 2 * sin 30, 2(3) -> 2 * (3), ) ( -> ) * (
      const finalTokens = [];
      for (let j = 0; j < list.length; j++) {
        finalTokens.push(list[j]);
        if (j < list.length - 1) {
          const curr = list[j];
          const next = list[j + 1];
          const leftCanMult = (curr.type === 'NUM' || curr.type === 'RPAREN' || curr.type === 'POST');
          const rightCanMult = (next.type === 'NUM' || next.type === 'LPAREN' || next.type === 'PRE' || next.type === 'FUNC2');
          if (leftCanMult && rightCanMult) {
            finalTokens.push({ type: 'OP', val: '×' });
          }
        }
      }
      return finalTokens;
    }

    function parseAndEval(rawStr) {
      // Pre-handle DMS like 12°30°45° and mixed fractions 1⌟2⌟3
      let s = rawStr
        .replace(/(\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)°?/g, '(($1)+($2)/60+($3)/3600)')
        .replace(/(\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)°/g, '(($1)+($2)/60)')
        .replace(/(\d+)⌟(\d+)⌟(\d+)/g, '(($1)+($2)÷($3))')
        .replace(/(\d+)⌟(\d+)/g, '(($1)÷($2))');

      const tks = tokenizeMath(s);
      let pos = 0;

      function peek() { return tks[pos]; }
      function consume() { return tks[pos++]; }

      function parseExpr() {
        let left = parseTerm();
        while (peek() && peek().type === 'OP' && (peek().val === '+' || peek().val === '-')) {
          const op = consume().val;
          const right = parseTerm();
          left = op === '+' ? left + right : left - right;
        }
        return left;
      }

      function parseTerm() {
        let left = parseInfixSci();
        while (peek() && peek().type === 'OP' && (peek().val === '×' || peek().val === '÷')) {
          const op = consume().val;
          const right = parseInfixSci();
          left = op === '×' ? left * right : left / right;
        }
        return left;
      }

      function parseInfixSci() {
        let left = parseUnary();
        while (peek() && peek().type === 'OP' && ['P', 'C', '^', 'ˣ√', '⌟'].includes(peek().val)) {
          const op = consume().val;
          const right = parseUnary();
          if (op === 'P') left = nPr(left, right);
          else if (op === 'C') left = nCr(left, right);
          else if (op === '^') left = Math.pow(left, right);
          else if (op === 'ˣ√') left = Math.pow(right, 1 / left);
          else if (op === '⌟') left = left / right;
        }
        return left;
      }

      function parseUnary() {
        if (peek() && peek().type === 'OP' && (peek().val === '+' || peek().val === '-')) {
          const op = consume().val;
          const v = parseUnary();
          return op === '-' ? -v : v;
        }
        if (peek() && peek().type === 'PRE') {
          const fn = consume().val;
          const arg = parseUnary();
          switch (fn) {
            case 'sin': return Math.sin(toRad(arg));
            case 'cos': return Math.cos(toRad(arg));
            case 'tan': return Math.tan(toRad(arg));
            case 'sin⁻¹': return fromRad(Math.asin(arg));
            case 'cos⁻¹': return fromRad(Math.acos(arg));
            case 'tan⁻¹': return fromRad(Math.atan(arg));
            case 'sinh': return Math.sinh(arg);
            case 'cosh': return Math.cosh(arg);
            case 'tanh': return Math.tanh(arg);
            case 'sinh⁻¹': return Math.asinh(arg);
            case 'cosh⁻¹': return Math.acosh(arg);
            case 'tanh⁻¹': return Math.atanh(arg);
            case 'log': return Math.log10(arg);
            case 'ln': return Math.log(arg);
            case '10^': return Math.pow(10, arg);
            case 'e^': return Math.exp(arg);
            case '√': return Math.sqrt(arg);
            case '³√': return Math.cbrt(arg);
          }
        }
        return parsePostfix();
      }

      function parsePostfix() {
        let val = parsePrimary();
        while (peek() && peek().type === 'POST') {
          const post = consume().val;
          if (post === '²') val = val * val;
          else if (post === '³') val = val * val * val;
          else if (post === '⁻¹') val = 1 / val;
          else if (post === '!') val = fact(val);
        }
        return val;
      }

      function parsePrimary() {
        const tk = peek();
        if (!tk) throw new Error('Unexpected end');

        if (tk.type === 'NUM') {
          consume();
          return tk.val;
        }

        if (tk.type === 'FUNC2') {
          const fn = consume().val;
          if (peek() && peek().type === 'LPAREN') consume();
          const a = parseExpr();
          if (!peek() || peek().type !== 'COMMA') throw new Error('Missing comma');
          consume();
          const b = parseExpr();
          if (peek() && peek().type === 'RPAREN') consume();
          if (fn === 'Pol') {
            const r = Math.hypot(a, b);
            const th = fromRad(Math.atan2(b, a));
            memory.X = r; memory.Y = th;
            return r;
          } else {
            const x = a * Math.cos(toRad(b));
            const y = a * Math.sin(toRad(b));
            memory.X = x; memory.Y = y;
            return x;
          }
        }

        if (tk.type === 'LPAREN') {
          consume();
          const v = parseExpr();
          if (peek() && peek().type === 'RPAREN') consume();
          return v;
        }

        throw new Error('Syntax Error');
      }

      const out = parseExpr();
      if (pos < tks.length) throw new Error('Trailing tokens');
      return out;
    }

    function evaluateExpression() {
      if (isPoweredOff || tokens.length === 0) return;

      const raw = tokens.join('');
      const isPercent = shiftActive;
      clearModifiers();

      try {
        const result = parseAndEval(raw);
        const finalVal = isPercent ? result / 100 : result;

        if (typeof finalVal === 'number' && !isNaN(finalVal)) {
          lastResult = finalVal;
          ans = finalVal;
          history.push({ tokens: [...tokens], result: finalVal });
          historyIndex = history.length - 1;
        } else {
          lastResult = 'Math ERROR';
        }
      } catch (err) {
        lastResult = 'Syntax ERROR';
      }

      isResultDisplayed = true;
      dmsMode = false;
      fracMode = false;
      engShift = 0;
      updateDisplay();
    }

    // Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') handleNum(e.key);
      else if (e.key === '.') handleDot();
      else if (e.key === '+') handleOp('+');
      else if (e.key === '-') handleOp('-');
      else if (e.key === '*') handleOp('×');
      else if (e.key === '/') { e.preventDefault(); handleOp('÷'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); evaluateExpression(); }
      else if (e.key === 'Backspace') pressDel();
      else if (e.key === 'Escape') pressAc();
      else if (e.key === 'ArrowLeft') moveCursor('LEFT');
      else if (e.key === 'ArrowRight') moveCursor('RIGHT');
      else if (e.key === 'ArrowUp') moveCursor('UP');
      else if (e.key === 'ArrowDown') moveCursor('DOWN');
    });

    // --- PWA Setup ---
    function setupPWA() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      let deferredPrompt;
      const installBanner = document.getElementById('installBanner');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBanner.classList.remove('hidden');
      });

      installBanner.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.classList.add('hidden');
        }
        deferredPrompt = null;
      });

      window.addEventListener('appinstalled', () => {
        installBanner.classList.add('hidden');
      });
    }

    setupPWA();
    updateDisplay();
  </script>
</body>
